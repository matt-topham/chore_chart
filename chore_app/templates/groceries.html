<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Groceries</title><link rel="stylesheet" href="/static/dashboard.css"></head><body><header class="hero"><div><p class="eyebrow">Shopping</p><h1>Grocery List</h1><p class="clock"><a href="/" style="color:white">← Home</a></p></div></header><main class="dashboard"><section class="card" style="grid-column:span 12"><div class="card-title"><div><span class="kicker">Shared list</span><h2>Groceries</h2></div><button class="round-add" id="add">+</button></div><div id="list" class="list"></div></section></main><dialog id="dialog"><form id="form"><h3>Add grocery</h3><input name="item" placeholder="Item" required><input name="quantity" placeholder="Quantity"><select name="category"><option>Produce</option><option>Dairy</option><option>Meat</option><option>Pantry</option><option>Frozen</option><option>Household</option><option selected>Other</option></select><div class="dialog-actions"><button type="button" id="cancel">Cancel</button><button class="primary">Add</button></div></form></dialog><script>const list=document.getElementById('list'),dialog=document.getElementById('dialog');async function load(){const r=await fetch('/api/groceries');const d=await r.json();list.innerHTML=d.groceries.map(g=>`<button class="task-row" data-id="${g.id}" style="opacity:${g.completed?'.45':'1'}"><span class="check">✓</span><span><strong>${g.item}</strong><small>${g.category}${g.quantity?' · '+g.quantity:''}</small></span></button>`).join('')||'<p class="empty">Your grocery list is empty.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await fetch('/api/groceries/'+b.dataset.id+'/toggle',{method:'POST'});load()})}document.getElementById('add').onclick=()=>dialog.showModal();document.getElementById('cancel').onclick=()=>dialog.close();document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await fetch('/api/groceries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});e.target.reset();dialog.close();load()};load()</script></body></html>
